<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>20261111 — Helicoid</title>
  <script src="../p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F2F0EA; overflow: hidden; font-family: ui-monospace, "Menlo", "Consolas", monospace; }
    canvas { display: block; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 100vw; max-height: 100vh; width: auto; height: 100vh; object-fit: contain; }
    #controls { position: fixed; top: 18px; left: 18px; background: rgba(0,0,0,0.82); padding: 14px 16px; border-radius: 14px; color: #bbb; z-index: 100; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(14px); min-width: 320px; max-width: calc(100vw - 36px); max-height: calc(100vh - 36px); overflow-y: auto; }
    #controls strong { color: #fff; font-size: clamp(13px, 1.1vw + 9px, 15px); letter-spacing: 0.14em; }
    #controls > div:first-child { margin-bottom: 8px; }
    button { background: rgba(40,40,40,0.9); color: #f0f0f0; border: 1px solid rgba(255,255,255,0.15); padding: 8px 15px; margin: 4px 5px 0 0; border-radius: 999px; cursor: pointer; font-size: clamp(13px, 1vw + 9px, 14px); font-family: inherit; letter-spacing: 0.06em; }
    button:hover { background: rgba(70,70,70,0.9); border-color: rgba(255,255,255,0.3); }
    button:disabled { color: #555; cursor: not-allowed; border-color: rgba(255,255,255,0.06); }
    #status { margin-top: 9px; font-size: clamp(13px, 1vw + 9px, 14px); color: #ccc; }
    #info { font-size: clamp(12px, 0.8vw + 8px, 13px); color: #777; margin-top: 6px; line-height: 1.8; }
    #info span { color: #ccc; }
    #progressTrack { margin-top: 8px; height: 4px; width: 100%; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
    #progressFill { height: 100%; width: 0%; background: #fff; transition: width 80ms linear; }
    #sim { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.08); font-size: clamp(12px, 0.8vw + 8px, 13px); }
    #sim label.slider { display: block; margin-top: 6px; color: #888; }
    #sim label.slider span { color: #ccc; float: right; }
    #sim input[type=range] { display: block; width: 100%; margin-top: 3px; accent-color: #fff; }
    #sim input:disabled { opacity: 0.35; }
    #toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; margin-top: 9px; color: #999; }
    #toggles input { accent-color: #fff; margin-right: 5px; vertical-align: -1px; }
    #math { margin-top: 9px; line-height: 1.7; color: #777; }
    #math span { color: #ccc; }
  </style>
</head>
<body>
  <div id="controls">
    <div><strong>20261111 — HELICOID</strong></div>
    <button id="startBtn">Record</button>
    <button id="stopBtn" disabled>Stop</button>
    <div id="status">Ready</div>
    <div id="progressTrack"><div id="progressFill"></div></div>
    <div id="info">
      Duration: <span id="duration">0.0</span>s / <span id="maxDuration">10</span>s<br>
      Frames: <span id="frameCount">0</span> / <span id="maxFrames">—</span><br>
      Canvas: <span id="canvasSize">—</span><br>
      Shortcut: <span>R</span> record · <span>S</span> still · <span>H</span> controls · <span>1–3</span> turns · <span>P</span> pause
    </div>
    <div id="sim">
      <button id="preset-turns1">1 · T = 1</button>
      <button id="preset-turns15">2 · T = 1.5</button>
      <button id="preset-turns25">3 · T = 2.5</button>
      <label class="slider">Pitch c <span id="pitchValue">—</span><input id="pitchSlider" type="range" min="0.05" max="0.2" step="0.005"></label>
      <label class="slider">Turns T <span id="turnsValue">—</span><input id="turnsSlider" type="range" min="1" max="3" step="0.5"></label>
      <label class="slider">Radial extent U <span id="extentValue">—</span><input id="extentSlider" type="range" min="0.6" max="1.4" step="0.01"></label>
      <label class="slider">Mesh resolution <span id="rowsValue">—</span><input id="rowsSlider" type="range" min="48" max="160" step="1"></label>
      <label class="slider">Helices (u = const) <span id="helixValue">—</span><input id="helixSlider" type="range" min="3" max="12" step="1"></label>
      <label class="slider">Rulings (z = const) <span id="rulingValue">—</span><input id="rulingSlider" type="range" min="12" max="48" step="6"></label>
      <label class="slider">Plate divisions <span id="divisionValue">—</span><input id="divisionSlider" type="range" min="6" max="24" step="6"></label>
      <label class="slider">Camera elevation <span id="tiltValue">—</span><input id="tiltSlider" type="range" min="0.1" max="0.8" step="0.01"></label>
      <label class="slider">Rotation <span id="spinValue">—</span><input id="spinSlider" type="range" min="-2" max="2" step="1"></label>
      <label class="slider">Light intensity <span id="lightValue">—</span><input id="lightSlider" type="range" min="0.4" max="1.6" step="0.01"></label>
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
      <div id="toggles">
        <label><input id="showNet" type="checkbox" checked>Helices</label>
        <label><input id="showContours" type="checkbox" checked>Rulings</label>
        <label><input id="showPlate" type="checkbox" checked>Sacred plate</label>
        <label><input id="showNotes" type="checkbox" checked>Annotations</label>
        <label><input id="showMath" type="checkbox" checked>Math info</label>
      </div>
      <div id="math">
        <span id="pitchInfo">—</span><br>
        K range: <span id="kValue">—</span><br>
        Screw phase z: <span id="levelValue">—</span><br>
        <span id="meshValue">—</span><br>
        Frame cost: <span id="costValue">—</span> ms
      </div>
    </div>
  </div>
  <script src="sketch.js?v=20261111-helicoid-a"></script>
</body>
</html>
